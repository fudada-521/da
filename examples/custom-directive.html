<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Da 框架 — 自定义指令示例</title>
  <style>
    body { font-family: sans-serif; max-width: 640px; margin: 40px auto; padding: 0 20px; }
    h2 { color: #42b883; }
    code { background: #e8f5e9; padding: 2px 6px; border-radius: 4px; font-size: 13px; }
    hr { border: none; border-top: 1px solid #e0e0e0; margin: 24px 0; }
    pre { background: #f5f5f5; padding: 12px; border-radius: 8px; font-size: 13px; overflow-x: auto; }
  </style>
</head>
<body>
  <h2>🧩 自定义指令</h2>
  <p>用 <code>Da.register()</code> 可注册自定义指令，在模板中使用 <code>da-xxx</code>。</p>

  <da-directive-demo></da-directive-demo>

  <hr />

  <h3>📦 注册方式</h3>
  <pre>import { register } from '../src/da.js'

register('my-directive', {
  mount(el, binding) { /* 首次绑定 */ },
  update(el, binding) { /* 更新时 */ },
  unmount(el)     { /* 解绑时 */ },
})
  </pre>

  <script type="module">
    import { register } from '../src/da.js'
    import DirectiveDemo from './components/DirectiveDemo.js'

    // da-highlight：悬停高亮
    register('highlight', {
      mount(el, binding) {
        el.style.transition = 'background 0.3s'
        el._highlightColor = binding.value || '#fff3cd'
        el.addEventListener('mouseenter', () => { el.style.background = el._highlightColor })
        el.addEventListener('mouseleave', () => { el.style.background = '' })
      },
      update(el, binding) { el._highlightColor = binding.value || '#fff3cd' },
      unmount(el) { el.style.background = '' },
    })

    // da-focus：自动聚焦
    register('focus', { mount(el) { setTimeout(() => el.focus(), 50) } })

    // da-number：数字格式化
    register('number', {
      mount(el, binding) {
        const d = binding.arg ? parseInt(binding.arg) : 0
        el.textContent = (parseFloat(binding.value) || 0).toFixed(d)
      },
      update(el, binding) {
        const d = binding.arg ? parseInt(binding.arg) : 0
        el.textContent = (parseFloat(binding.value) || 0).toFixed(d)
      },
    })

    DirectiveDemo.define()
  </script>
</body>
</html>
