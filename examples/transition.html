<!-- @format -->

<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0" />
        <title>Da 框架 — 过渡动画示例</title>
        <style>
            body {
                font-family: sans-serif;
                max-width: 640px;
                margin: 40px auto;
                padding: 0 20px;
            }
            h2 {
                color: #42b883;
            }
            code {
                background: #e8f5e9;
                padding: 2px 6px;
                border-radius: 4px;
                font-size: 13px;
            }
            button {
                padding: 8px 20px;
                border: 1px solid #42b883;
                background: #fff;
                color: #42b883;
                border-radius: 6px;
                cursor: pointer;
                font-size: 14px;
            }
            button:hover {
                background: #42b883;
                color: #fff;
            }
            .box {
                padding: 20px;
                border-radius: 8px;
                background: #42b883;
                color: #fff;
                text-align: center;
                font-size: 16px;
                margin-top: 8px;
            }
            .box.orange {
                background: #e67e22;
            }
            .box.purple {
                background: #9b59b6;
            }
            .card-demo {
                border: 2px solid #42b883;
                border-radius: 12px;
                padding: 16px;
                margin-top: 8px;
                min-height: 60px;
            }

            /* fade */
            .fade-enter-active,
            .fade-leave-active {
                transition: opacity 0.5s ease;
            }
            .fade-enter-from,
            .fade-leave-to {
                opacity: 0;
            }
            .fade-enter-to,
            .fade-leave-from {
                opacity: 1;
            }

            /* slide */
            .slide-enter-active,
            .slide-leave-active {
                transition: all 0.4s ease;
                overflow: hidden;
            }
            .slide-enter-from,
            .slide-leave-to {
                opacity: 0;
                transform: translateX(30px);
            }
            .slide-enter-to,
            .slide-leave-from {
                opacity: 1;
                transform: translateX(0);
            }

            /* scale */
            .scale-enter-active,
            .scale-leave-active {
                transition: all 0.35s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            }
            .scale-enter-from,
            .scale-leave-to {
                opacity: 0;
                transform: scale(0.5);
            }
            .scale-enter-to,
            .scale-leave-from {
                opacity: 1;
                transform: scale(1);
            }
            .scale-leave-active {
                transition: all 0.25s ease-in;
            }

            /* combine（out-in） */
            .combine-enter-active,
            .combine-leave-active {
                transition: all 0.4s ease;
            }
            .combine-enter-from {
                opacity: 0;
                transform: translateY(-20px);
            }
            .combine-leave-to {
                opacity: 0;
                transform: translateY(20px);
            }
        </style>
    </head>
    <body>
        <h2>🎬 过渡动画</h2>

        <div id="app">
            <!-- ===== fade ===== -->
            <h3>🌫️ 渐入渐出（fade）</h3>
            <da-transition :show="showAttr(showFade)" name="fade">
                <div class="box">✨ 渐入渐出效果</div>
            </da-transition>
            <p><button @click="showFade = !showFade">{{ showFade ? '隐藏' : '显示' }}</button></p>

            <!-- ===== slide ===== -->
            <h3>📐 滑动（slide）</h3>
            <da-transition :show="showAttr(showSlide)" name="slide">
                <div class="box orange">➡️ 从右侧滑入</div>
            </da-transition>
            <p><button @click="showSlide = !showSlide">{{ showSlide ? '隐藏' : '显示' }}</button></p>

            <!-- ===== scale ===== -->
            <h3>🔍 缩放（scale）</h3>
            <da-transition :show="showAttr(showScale)" name="scale">
                <div class="box purple">🌀 弹性缩放</div>
            </da-transition>
            <p><button @click="showScale = !showScale">{{ showScale ? '隐藏' : '显示' }}</button></p>

            <!-- ===== out-in 卡片切换 ===== -->
            <h3>🔄 out-in 模式</h3>
            <da-transition :show="showAttr(showCard)" name="combine" mode="out-in">
                <div class="card-demo" da-html="cardHTML"></div>
            </da-transition>
            <p>
                <button @click="switchCard">切换卡片</button>
                <span style="font-size: 13px; color: #999; margin-left: 8px">旧内容离开后才进入新内容</span>
            </p>
        </div>

        <script type="module">
            import { mount } from "../src/da.js";

            const cards = [
                { title: "第一张卡片", desc: "这是卡片 A 的内容。" },
                { title: "第二张卡片", desc: "这是卡片 B 的内容，切换时有交互动画。" },
                { title: "第三张卡片", desc: "卡片 C：out-in 模式确保过渡平滑。" },
            ];

            const renderCard = (card) => `<h4>${card.title}</h4><p style="color:#666;">${card.desc}</p>`;

            mount("#app", {
                showFade: true,
                showSlide: false,
                showScale: true,
                showCard: true,
                cardIndex: 0,
                cardHTML: renderCard(cards[0]),

                // da-transition 通过 show 属性判断显隐，需传 'true' / 'false' 字符串
                showAttr(v) {
                    return v ? "true" : "false";
                },

                switchCard() {
                    this.cardIndex = (this.cardIndex + 1) % cards.length;
                    this.cardHTML = renderCard(cards[this.cardIndex]);
                    // 先离开，等离开动画结束再进入（out-in）
                    this.showCard = false;
                    setTimeout(() => {
                        this.showCard = true;
                    }, 420);
                },
            });
        </script>
    </body>
</html>
