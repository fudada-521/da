<!-- @format -->

<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0" />
        <title>Da 框架 — 列表过渡示例</title>
        <style>
            body {
                font-family: sans-serif;
                max-width: 600px;
                margin: 40px auto;
                padding: 0 20px;
            }
            h2 {
                color: #42b883;
            }
            code {
                background: #e8f5e9;
                padding: 2px 6px;
                border-radius: 4px;
                font-size: 13px;
            }
            button {
                padding: 6px 14px;
                border: 1px solid #42b883;
                background: #fff;
                color: #42b883;
                border-radius: 6px;
                cursor: pointer;
                font-size: 13px;
            }
            button:hover {
                background: #42b883;
                color: #fff;
            }
            button.danger {
                border-color: #e74c3c;
                color: #e74c3c;
            }
            button.danger:hover {
                background: #e74c3c;
                color: #fff;
            }
            input {
                padding: 6px 10px;
                border: 1px solid #ddd;
                border-radius: 6px;
                font-size: 14px;
            }
            .toolbar {
                display: flex;
                gap: 8px;
                margin-bottom: 12px;
                flex-wrap: wrap;
            }
            hr {
                border: none;
                border-top: 1px solid #e0e0e0;
                margin: 24px 0;
            }

            da-transition-group {
                display: block;
            }
            da-transition-group ul {
                list-style: none;
                padding: 0;
                margin: 0;
                position: relative;
                min-height: 40px;
            }
            .row {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 10px 14px;
                border-bottom: 1px solid #eee;
                background: #fff;
                width: 100%;
                box-sizing: border-box;
            }
            .row span {
                flex: 1;
            }

            /* list 过渡 */
            .list-enter-active,
            .list-leave-active {
                transition: all 0.4s ease;
            }
            .list-enter-from {
                opacity: 0;
                transform: translateX(-30px);
            }
            .list-leave-to {
                opacity: 0;
                transform: translateX(30px);
            }
            /* 离开的元素脱离文档流，其余元素自然补位 */
            .list-leave-active {
                position: absolute;
            }
            .list-move {
                transition: transform 0.4s ease;
            }

            /* bounce 过渡 */
            .bounce-enter-active {
                animation: bounce-in 0.4s;
            }
            .bounce-leave-active {
                animation: bounce-in 0.3s reverse;
            }
            @keyframes bounce-in {
                0% {
                    transform: scale(0);
                    opacity: 0;
                }
                50% {
                    transform: scale(1.2);
                }
                100% {
                    transform: scale(1);
                    opacity: 1;
                }
            }
            .bounce-move {
                transition: transform 0.4s ease;
            }
            .bounce-leave-active {
                position: absolute;
            }
            .chip {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                padding: 6px 14px;
                margin: 4px;
                border-radius: 20px;
                background: #e8f5e9;
                border: 1px solid #42b883;
                font-size: 13px;
            }
            .chip button {
                padding: 0 4px;
                border: none;
                background: none;
                cursor: pointer;
                font-size: 16px;
                line-height: 1;
                color: #666;
            }
        </style>
    </head>
    <body>
        <h2>📋 列表过渡</h2>
        <p>使用 <code>&lt;da-transition-group&gt;</code> + <code>da-for</code>，添加 / 删除 / 排序时自动过渡。</p>

        <div id="app">
            <da-transition-group name="list" tag="ul">
                <li da-for="item in items" :key="item.id" class="row">
                    <span>{{ item.text }}</span>
                    <button class="danger" @click="removeItem(item)">✕</button>
                </li>
            </da-transition-group>

            <div class="toolbar">
                <input
                    da-model="newItem"
                    placeholder="输入新项..."
                    style="flex: 1"
                    @keyup.enter="addItem" />
                <button @click="addItem">添加</button>
                <button class="danger" @click="shuffle">随机排序</button>
            </div>

            <hr />

            <h3>🎨 更多过渡效果</h3>
            <da-transition-group name="bounce" tag="div">
                <span da-for="chip in chips" :key="chip" class="chip">
                    {{ chip }} <button @click="removeChipItem(chip)">×</button>
                </span>
            </da-transition-group>

            <div class="toolbar">
                <button @click="addChip">添加标签</button>
                <button class="danger" @click="removeChip">移除最后一个</button>
            </div>
        </div>

        <script type="module">
            import { mount } from "../src/da.js";

            const CHIP_NAMES = ["Vue", "React", "Svelte", "Angular", "Solid", "Qwik", "Preact"];
            // 初始 items 已占用 id 1-4，从 4 开始续号，避免 key 冲突
            let idCounter = 4;

            const api = mount("#app", {
                items: [
                    { id: 1, text: "🍎 苹果" },
                    { id: 2, text: "🍊 橘子" },
                    { id: 3, text: "🍋 柠檬" },
                    { id: 4, text: "🍇 葡萄" },
                ],
                newItem: "",
                chips: ["CSS", "HTML", "JavaScript", "WebComponent"],

                addItem() {
                    const text = this.newItem.trim();
                    if (!text) return;
                    this.items.push({ id: ++idCounter, text: `#${idCounter} ${text}` });
                    this.newItem = "";
                },
                shuffle() {
                    // 打乱后一次性重赋值：单次数组变更 → 单次 keyed diff → FLIP 位移完整
                    const arr = [...this.items];
                    for (let i = arr.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [arr[i], arr[j]] = [arr[j], arr[i]];
                    }
                    this.items = arr;
                },
                addChip() {
                    this.chips.push(CHIP_NAMES[Math.floor(Math.random() * CHIP_NAMES.length)]);
                },
                removeChip() {
                    this.chips.pop();
                },
            });

            // da-for 列表内的 ✕ 按钮用内联语句调用（如 removeItem(item)），
            // 此时 this 不可用，改用闭包操作响应式数组
            api.removeItem = (item) => {
                const i = api.items.indexOf(item);
                if (i > -1) api.items.splice(i, 1);
            };
            api.removeChipItem = (chip) => {
                const i = api.chips.indexOf(chip);
                if (i > -1) api.chips.splice(i, 1);
            };
        </script>
    </body>
</html>
